SPECIFICATION RetrySpec
CONSTANTS
  Tabs = {t1, t2}
  Slots = {s1}
  HoldMinutes = 1
  Backstop = 1
  MaxTime = 1
  MaxNonce = 6
  MaxRetries = 3
SYMMETRY TabPermutations
INVARIANTS
  TypeOK
  OneHoldPerSlotStart
  HeldSlotNeverTaken
  CommitOnlyAgainstActiveHold
  OneBookingPerPayment
  PaidInTimeNeverDisplaced
  PaidInTimeKeepsSlot
  PaymentHoldHasOwner
  FailureCountBounded
  ObservedFailureNeverOriginalSlot
  LateCaptureRequiresDurableClaim
PROPERTIES
  NoSecondHoldOverLiveHold
  PaymentHoldKeptThroughBackstop
  TypedDetailsKept
  RetainedFailureNeverExtendsExpiry
