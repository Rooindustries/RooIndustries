name: Production smoke watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check queued Production smoke runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          queued="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/production-smoke.yml/runs?status=queued&per_page=100" |
            jq -r '.workflow_runs[] | select(.status == "queued" and (now - ((.run_started_at // .created_at) | fromdateiso8601) > 1200)) | .html_url')"
          if [ -n "$queued" ]; then
            printf '::error::A Production smoke run has been queued for over 20 minutes: %s\n' "${queued//$'\n'/ }"
            exit 1
          fi
          echo "No Production smoke run has been queued for over 20 minutes."
