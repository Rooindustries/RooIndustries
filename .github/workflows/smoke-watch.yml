name: Production smoke watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watch:
    name: Production smoke started in time
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail while a Production smoke has waited over 20 minutes for its runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stuck="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production-smoke.yml/runs?status=queued&per_page=100" \
            --jq '.workflow_runs[] | select(now - (.created_at | fromdateiso8601) > 1200) | .html_url')"
          if [ -n "$stuck" ]; then
            echo "::error::A Production smoke has waited over 20 minutes for its runner. Set SMOKE_RUNNER to ubuntu-24.04 and re-run it: $stuck"
            exit 1
          fi
          echo "No Production smoke is waiting for a runner."
