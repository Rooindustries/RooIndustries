name: Refresh Playwright timings

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    name: Refresh per-file Playwright timings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect timings from the latest passing test runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports="$RUNNER_TEMP/timing-reports"
          mkdir -p "$reports" .playwright-timings
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY) | .id' \
            > "$RUNNER_TEMP/runs.txt"
          collected=0
          while read -r run && [ "$collected" -lt 10 ]; do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'test-timings-*' --dir "$reports/$run"; then
              collected=$((collected + 1))
            else
              echo "Run $run kept no timing artifacts"
            fi
          done < "$RUNNER_TEMP/runs.txt"
          echo "Collected timings from $collected runs"
          node scripts/playwright-timings.mjs "$reports" > .playwright-timings/timings.json
          node -e 'const t = require("./.playwright-timings/timings.json"); console.log(`${Object.keys(t).length} spec files timed`)'
      - uses: actions/cache/save@v4
        with:
          path: .playwright-timings
          key: playwright-timings-${{ github.run_id }}
