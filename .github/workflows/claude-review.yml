name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for Claude token
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$OAUTH" ]; then
            echo "mode=review" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.auth.outputs.mode == 'review'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review pull request
        id: claude
        if: steps.auth.outputs.mode == 'review'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number || github.event.issue.number }}.

            Report only real bugs, security issues, and correctness problems. Skip style, nits, and speculative suggestions.

            Post exactly one concise summary with `gh pr comment`. When a finding refers to specific lines, also post an inline comment with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`.

            Do not approve. Do not request changes. Do not call `gh pr review`. Comments only.

            If there is nothing material to report, post the summary saying so in one or two sentences and do not add inline comments.
          claude_args: |
            --max-turns 8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Report result
        if: always() && !cancelled()
        env:
          MODE: ${{ steps.auth.outputs.mode }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ "$MODE" != "review" ]; then
            echo "::notice::Claude review skipped: CLAUDE_CODE_OAUTH_TOKEN is not set."
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "Claude review did not run."
            exit 1
          fi

          limited=0
          for file in "$EXECUTION_FILE" "${RUNNER_TEMP:-}/claude-execution-output.json"; do
            if [ -n "$file" ] && [ -f "$file" ] && jq -e '
              any(
                .[]?;
                .type == "rate_limit_event"
                or .api_error_status == 429
                or (.error.type? == "rate_limit_error")
                or (
                  .type == "result"
                  and (
                    ((.result // "") | tostring | test("rate[_ ]limit|usage limit|session limit|weekly limit|hit your limit|extra usage|too many requests"; "i"))
                    or any(.errors[]?; tostring | test("rate[_ ]limit|usage limit|session limit|weekly limit|hit your limit|extra usage|too many requests"; "i"))
                  )
                )
              )
            ' "$file" >/dev/null; then
              limited=1
              break
            fi
          done
          if [ "$limited" -eq 1 ]; then
            echo "::notice::Claude review skipped: this Team seat hit a usage limit. Replace CLAUDE_CODE_OAUTH_TOKEN with a token from another seat."
            exit 0
          fi
          echo "Claude review failed."
          exit 1
