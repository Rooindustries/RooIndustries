name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tested-tree:
    name: Check for an already tested tree
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/tested-tree.sh

  monitoring:
    name: Production-only monitoring
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SENTRY_CLI_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          browser-deps: "false"
      - name: Allow isolated monitoring on GitHub-hosted runners
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' \
              'profile roo-monitoring-unshare /usr/bin/unshare flags=(unconfined) {' \
              '  userns,' '}' | sudo apparmor_parser --replace
          fi
      - name: Check network isolation tools
        run: |
          command -v unshare
          command -v ip
          command -v cc
      - name: Check monitoring
        run: |
          if command -v heavy >/dev/null; then
            heavy npm run test:monitoring
            heavy npm run test:monitoring:startup
            heavy npm run test:monitoring:deployments
          else
            npm run test:monitoring
            npm run test:monitoring:startup
            npm run test:monitoring:deployments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-deployments
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  jest:
    name: Jest
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: |
          node_options="$(node scripts/lib/node-options.mjs --import "$PWD/scripts/lib/test-target-safety.mjs")"
          NODE_OPTIONS="$node_options" npm test -- --maxWorkers=2
        env:
          BASE_URL: http://127.0.0.1:3211
          TOOLING_NETWORK_GUARD: "1"
      - run: npm run lint
      - run: npm run test:lint-rules
      - run: npm run test:playwright-groups
      - run: npm run test:tested-tree
      - run: npm run test:free-ports
      - name: Allow user namespaces for the build lock checks
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' \
              'profile roo-build-lock-unshare /usr/bin/unshare flags=(unconfined) {' \
              '  userns,' '}' | sudo apparmor_parser --replace
          fi
      - run: npm run test:build-lock
      - run: npm run test:tooling:dependencies
      - run: npm run check:seo
      - run: npm run check:supabase:migrations
      - run: npm run test:deploy:rollback

  booking-model:
    name: Booking hold model
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run check:booking-model

  playwright:
    name: Playwright ${{ matrix.suite.name }}
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: navigation
          - name: booking
          - name: rest-1
          - name: rest-2
          - name: rest-3
          - name: rest-4
    env:
      PW_SUITE: ${{ matrix.suite.name }}
      ROO_TEST_HOST: 127.0.0.1
      BASE_URL: http://127.0.0.1:3211
      PW_PORT: "3211"
      PW_SERVER_ID: ci
      NEXT_DIST_DIR: .next-e2e-ci
      TOOLING_API_ROUTES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium webkit
          build-dirs: .next-e2e-ci/cache/webpack
      - name: Pick a fixed group's spec file
        if: ${{ !startsWith(matrix.suite.name, 'rest-') }}
        run: |
          case "$PW_SUITE" in
            navigation) echo 'PW_FILES=/section-nav\.spec\.js$' >> "$GITHUB_ENV" ;;
            booking) echo 'PW_FILES=/booking-flow\.spec\.js$' >> "$GITHUB_ENV" ;;
            *) echo "Unknown browser group $PW_SUITE" >&2; exit 1 ;;
          esac
      - name: Restore the latest per-file test timings
        if: startsWith(matrix.suite.name, 'rest-')
        uses: actions/cache/restore@v4
        with:
          path: .playwright-timings
          key: playwright-timings-latest
          restore-keys: playwright-timings-
      - name: Pick this group's spec files
        if: startsWith(matrix.suite.name, 'rest-')
        run: |
          files="$(node scripts/playwright-groups.mjs "$PW_SUITE" .playwright-timings/timings.json)"
          echo "PW_FILES=$files" >> "$GITHUB_ENV"
      - name: Run browser and agent-readiness tests
        run: |
          node scripts/test-tooling-sweep-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          for _ in {1..180}; do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          if [ "$PW_SUITE" = "rest-1" ]; then
            npm run check:budgets
            npm run check:no-scripting-media
            guarded_options="$(node scripts/lib/node-options.mjs --import "$PWD/scripts/lib/test-target-safety.mjs")"
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:agent-readiness
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:traffic-recovery
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:tourney-retirement:phases
            npm run test:remote-browser-guard
            npm run test:smoke:production
          fi
          xvfb-run -a npx playwright test --pass-with-no-tests --reporter=dot,json "$PW_FILES"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-timings/${{ matrix.suite.name }}.json
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: .next-e2e-ci/cache/webpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-${{ matrix.suite.name }}
          path: test-timings/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.suite.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  routes:
    name: Playwright creator portal and API routes
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROO_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium
          build-dirs: |
            .next-e2e-routes-api/cache/webpack
            .next-e2e-routes-portal/cache/webpack
      - name: Run API route suite
        id: api-routes
        env:
          PW_PORT: "3231"
          PW_SERVER_ID: routes-api
        run: xvfb-run -a npm run test:api:routes -- --output=test-results/api-routes
      - name: Run creator portal suite
        if: ${{ !cancelled() && (success() || steps.api-routes.outcome == 'failure') }}
        env:
          PW_PORT: "3241"
          PW_SERVER_ID: routes-portal
        run: xvfb-run -a npm run test:creator:portal -- --output=test-results/creator-portal
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: |
            .next-e2e-routes-api/cache/webpack
            .next-e2e-routes-portal/cache/webpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-routes
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native PostgreSQL 17 suites
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3211"
      PW_SERVER_ID: native
      NEXT_DIST_DIR: .next-e2e-native-admin
      BOOKING_CONTACT_PORT: "3220"
      BOOKING_ROUTE_PORT: "3225"
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "STORAGE_SOURCE=$RUNNER_TEMP/roo-storage-api-v1.79.33" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          build-dirs: |
            .next-e2e-native-admin/cache/webpack
            .next-e2e-native-booking/cache/webpack
      - uses: ./.github/actions/postgres
      - name: Build the pinned native Storage fixture
        run: |
          git clone --depth 1 --branch v1.79.33 https://github.com/supabase/storage.git "$STORAGE_SOURCE"
          test "$(git -C "$STORAGE_SOURCE" rev-parse HEAD)" = "2379ad5493f06bcf3bb5f044b844e292b98df4a0"
          npx --yes npm@11.12.1 ci --prefix "$STORAGE_SOURCE"
          npx --yes npm@11.12.1 run build --prefix "$STORAGE_SOURCE"
      - name: Run native admin CMS suite
        run: xvfb-run -a npx playwright test -c playwright.admin.config.js
      - name: Run all six native booking-hold browser cases
        env:
          NEXT_DIST_DIR: .next-e2e-native-booking
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-booking-hold.json
        run: |
          xvfb-run -a npx playwright test tests/booking-hold.spec.js --project=chromium --output=test-results/booking-hold-e2e --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/native-booking-hold.json');
          assert.equal(stats.expected, 6, 'All six native booking-hold cases must pass');
          assert.equal(stats.skipped, 0, 'Native booking-hold cases must not skip');
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run booking-contact PostgreSQL 17 suite
        run: npm run test:booking-contact
      - name: Run booking hold API suite
        run: npm run test:booking:holds
      - name: Run payment persistence sweep on the full migration chain
        run: node scripts/test-payment-persistence-sweep.mjs --full-chain
      - name: Run the remaining PostgreSQL 17 suites
        uses: ./.github/actions/npm-suites
        with:
          suites: >-
            booking-hold upgrade-credit upgrade-credit:ownership emails:postgres17 referral:postgres17
            referral-social:postgres17 backend-integrity:postgres17 referral-authority:postgres17
            referral-email:postgres17 referral-integrity:postgres17 account-domain:postgres17
            account-check:postgres17 commerce-readiness:postgres17 referral-email:origins tooling:safety
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: |
            .next-e2e-native-admin/cache/webpack
            .next-e2e-native-booking/cache/webpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-native
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  native-payouts:
    name: Native PostgreSQL 17 payout and recovery suites
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3211"
      PW_SERVER_ID: native
      NEXT_DIST_DIR: .next-e2e-native-admin
      BOOKING_CONTACT_PORT: "3220"
      BOOKING_ROUTE_PORT: "3225"
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
      - uses: ./.github/actions/postgres
      - name: Run the payout and recovery suites
        uses: ./.github/actions/npm-suites
        with:
          suites: creator-payouts:postgres17 booking-payment-window payment-recovery:postgres17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-native-payouts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  revalidation:
    name: Playwright revalidation
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROO_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium
          build-dirs: |
            .next-e2e-revalidation-benchmarks/cache/webpack
            .next-e2e-revalidation-static/cache/webpack
      - name: Run benchmarks revalidation suite
        id: benchmarks-revalidation
        env:
          PW_PORT: "3251"
          PW_SERVER_ID: revalidation-benchmarks
        run: xvfb-run -a npm run test:benchmarks:revalidation -- --output=test-results/benchmarks-revalidation
      - name: Run static pages revalidation suite
        if: ${{ !cancelled() && (success() || steps.benchmarks-revalidation.outcome == 'failure') }}
        env:
          PW_PORT: "3261"
          PW_SERVER_ID: revalidation-static
        run: xvfb-run -a npm run test:static:revalidation -- --output=test-results/static-revalidation
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: |
            .next-e2e-revalidation-benchmarks/cache/webpack
            .next-e2e-revalidation-static/cache/webpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-revalidation
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  record-tested-tree:
    name: Record the tested tree
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && needs.monitoring.result == 'success'
      && needs.jest.result == 'success'
      && needs.booking-model.result == 'success'
      && needs.playwright.result == 'success'
      && needs.routes.result == 'success'
      && needs.native.result == 'success'
      && needs.native-payouts.result == 'success'
      && needs.revalidation.result == 'success'
    needs: [monitoring, jest, booking-model, playwright, routes, native, native-payouts, revalidation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p tested-tree
          echo "$tree" > tested-tree/tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree/
          retention-days: 30
