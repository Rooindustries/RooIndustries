name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2
        env:
          BASE_URL: http://127.0.0.1:3211
          TOOLING_NETWORK_GUARD: "1"
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/lib/test-target-safety.mjs

  playwright:
    name: Playwright ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: navigation
            files: 'section-nav\.spec\.js'
          - name: booking
            files: 'booking-flow\.spec\.js'
          - name: rest
            files: '^(?!.*(section-nav|booking-flow)\.spec\.js$).*'
    env:
      PW_FILES: ${{ matrix.suite.files }}
      ROO_TEST_HOST: 127.0.0.1
      BASE_URL: http://127.0.0.1:3211
      PW_PORT: "3211"
      PW_SERVER_ID: ci
      NEXT_DIST_DIR: .next-e2e-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run browser and agent-readiness tests
        run: |
          node scripts/test-tooling-sweep-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          for attempt in {1..180}; do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          if [ "${{ matrix.suite.name }}" = "rest" ]; then
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="--import=$PWD/scripts/lib/test-target-safety.mjs" npm run test:agent-readiness
          fi
          xvfb-run -a npx playwright test "$PW_FILES"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.suite.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
