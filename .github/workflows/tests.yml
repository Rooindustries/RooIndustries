name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2
        env:
          BASE_URL: http://127.0.0.1:3211
          TOOLING_NETWORK_GUARD: "1"
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/lib/test-target-safety.mjs
      - run: npm run test:tooling:dependencies
      - run: npm run check:seo
      - run: npm run check:supabase:migrations

  playwright:
    name: Playwright ${{ matrix.suite.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: navigation
            files: 'section-nav\.spec\.js'
          - name: booking
            files: 'booking-flow\.spec\.js'
          - name: rest-1
            files: '^(?!.*(section-nav|booking-flow)\.spec\.js$).*'
            shard: 1/4
          - name: rest-2
            files: '^(?!.*(section-nav|booking-flow)\.spec\.js$).*'
            shard: 2/4
          - name: rest-3
            files: '^(?!.*(section-nav|booking-flow)\.spec\.js$).*'
            shard: 3/4
          - name: rest-4
            files: '^(?!.*(section-nav|booking-flow)\.spec\.js$).*'
            shard: 4/4
    env:
      PW_FILES: ${{ matrix.suite.files }}
      PW_SUITE: ${{ matrix.suite.name }}
      PW_SHARD: ${{ matrix.suite.shard }}
      ROO_TEST_HOST: 127.0.0.1
      BASE_URL: http://127.0.0.1:3211
      PW_PORT: "3211"
      PW_SERVER_ID: ci
      NEXT_DIST_DIR: .next-e2e-ci
      TOOLING_API_ROUTES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run browser and agent-readiness tests
        run: |
          node scripts/test-tooling-sweep-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          for _ in {1..180}; do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          if [ "$PW_SUITE" = "rest-1" ]; then
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="--import=$PWD/scripts/lib/test-target-safety.mjs" npm run test:agent-readiness
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="--import=$PWD/scripts/lib/test-target-safety.mjs" npm run test:traffic-recovery
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="--import=$PWD/scripts/lib/test-target-safety.mjs" npm run test:tourney-retirement:phases
            npm run test:remote-browser-guard
          fi
          xvfb-run -a npx playwright test --pass-with-no-tests ${PW_SHARD:+--shard="$PW_SHARD"} "$PW_FILES"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.suite.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  routes:
    name: Playwright creator portal and API routes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROO_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run API route suite
        id: api-routes
        env:
          PW_PORT: "3231"
          PW_SERVER_ID: routes-api
        run: xvfb-run -a npm run test:api:routes -- --output=test-results/api-routes
      - name: Run creator portal suite
        if: ${{ !cancelled() && (success() || steps.api-routes.outcome == 'failure') }}
        env:
          PW_PORT: "3241"
          PW_SERVER_ID: routes-portal
        run: xvfb-run -a npm run test:creator:portal -- --output=test-results/creator-portal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-routes
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native PostgreSQL 17 suites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3211"
      PW_SERVER_ID: native
      NEXT_DIST_DIR: .next-e2e-native-admin
      BOOKING_CONTACT_PORT: "3220"
      BOOKING_ROUTE_PORT: "3225"
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "STORAGE_SOURCE=$RUNNER_TEMP/roo-storage-api-v1.79.33" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install PostgreSQL 17 and PostgREST 16.4
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
          mkdir -p "$RUNNER_TEMP/postgrest"
          curl --fail --silent --show-error --location https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz -o "$RUNNER_TEMP/postgrest.tar.xz"
          echo "b47ecc82fce1dcebbbc4183d839e52f07f7630c9d7ad0f54db753d1939299354  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/postgrest"
          /usr/lib/postgresql/17/bin/postgres --version
          test "$("$RUNNER_TEMP/postgrest/postgrest" --version)" = "PostgREST 16.4"
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          echo "POSTGREST_BIN=$RUNNER_TEMP/postgrest/postgrest" >> "$GITHUB_ENV"
      - name: Build the pinned native Storage fixture
        run: |
          git clone --depth 1 --branch v1.79.33 https://github.com/supabase/storage.git "$STORAGE_SOURCE"
          test "$(git -C "$STORAGE_SOURCE" rev-parse HEAD)" = "2379ad5493f06bcf3bb5f044b844e292b98df4a0"
          npx --yes npm@11.12.1 ci --prefix "$STORAGE_SOURCE"
          npx --yes npm@11.12.1 run build --prefix "$STORAGE_SOURCE"
      - name: Run native admin CMS suite
        run: xvfb-run -a npx playwright test -c playwright.admin.config.js
      - name: Run all six native booking-hold browser cases
        env:
          NEXT_DIST_DIR: .next-e2e-native-booking
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-booking-hold.json
        run: |
          xvfb-run -a npx playwright test tests/booking-hold.spec.js --project=chromium --output=test-results/booking-hold-e2e --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/native-booking-hold.json');
          assert.equal(stats.expected, 6, 'All six native booking-hold cases must pass');
          assert.equal(stats.skipped, 0, 'Native booking-hold cases must not skip');
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run the native referral payment and claimed-start recovery E2Es
        env:
          NEXT_DIST_DIR: .next-e2e-native-booking
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-referral-payment.json
        run: |
          xvfb-run -a npm run test:referral-payment -- --output=test-results/referral-payment-e2e --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/native-referral-payment.json');
          assert.equal(stats.expected, 10, 'The native referral and coupon payment E2Es must pass');
          assert.equal(stats.skipped, 0, 'The native referral payment E2E must not skip');
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run booking-contact PostgreSQL 17 suite
        run: npm run test:booking-contact
      - name: Run booking hold API suite
        run: npm run test:booking:holds
      - name: Run payment persistence sweep on the full migration chain
        run: node scripts/test-payment-persistence-sweep.mjs --full-chain
      - name: Run the remaining PostgreSQL 17 suites
        run: |
          failed=()
          baseline=$(sed -n "s/.*const baselineCommit = '\([0-9a-f]\{40\}\)'.*/\1/p" tests/upgrade-credit.mjs)
          git fetch --no-tags --depth=1 origin "$baseline" || failed+=("upgrade-credit baseline fetch")
          for suite in booking-hold upgrade-credit emails:postgres17 payment-recovery:postgres17 referral:postgres17 referral-social:postgres17 backend-integrity:postgres17 referral-authority:postgres17 referral-email:postgres17 referral-integrity:postgres17 account-domain:postgres17 commerce-readiness:postgres17 referral-email:origins tooling:safety; do
            npm run "test:$suite" || failed+=("$suite")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed suites: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-native
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  revalidation:
    name: Playwright revalidation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROO_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run benchmarks revalidation suite
        id: benchmarks-revalidation
        env:
          PW_PORT: "3251"
          PW_SERVER_ID: revalidation-benchmarks
        run: xvfb-run -a npm run test:benchmarks:revalidation -- --output=test-results/benchmarks-revalidation
      - name: Run static pages revalidation suite
        if: ${{ !cancelled() && (success() || steps.benchmarks-revalidation.outcome == 'failure') }}
        env:
          PW_PORT: "3261"
          PW_SERVER_ID: revalidation-static
        run: xvfb-run -a npm run test:static:revalidation -- --output=test-results/static-revalidation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-revalidation
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
