name: Tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    tests-${{ github.event.pull_request.number || github.ref }}${{
    github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
  cancel-in-progress: true

jobs:
  tested-tree:
    name: Check for an already tested tree
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/tested-tree.sh

  monitoring:
    name: Production-only monitoring
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      SENTRY_CLI_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          browser-deps: "false"
      - name: Check network isolation tools
        run: |
          command -v unshare
          command -v ip
          command -v cc
      - name: Check monitoring
        run: |
          if command -v heavy >/dev/null; then
            heavy npm run test:monitoring
            heavy npm run test:monitoring:startup
            heavy npm run test:monitoring:startup
            heavy npm run test:monitoring:deployments
          else
            npm run test:monitoring
            npm run test:monitoring:startup
            npm run test:monitoring:startup
            npm run test:monitoring:deployments
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: monitoring-deployments
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  jest:
    name: Jest
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: |
          node_options="$(node scripts/lib/node-options.mjs --import "$PWD/scripts/lib/test-target-safety.mjs")"
          NODE_OPTIONS="$node_options" npm test -- --maxWorkers=2
        env:
          BASE_URL: http://127.0.0.1:3211
          TOOLING_NETWORK_GUARD: "1"
      - run: npm run lint
      - run: npm run test:repository-files
      - run: npm run test:runner-routing
      - run: npm run test:lint-rules
      - run: npm run test:playwright-groups
      - run: npm run test:scripts-start
      - run: npm run test:tested-tree
      - run: npm run test:free-ports
      - run: npm run test:fixture-ports
      - run: npm run test:reproducible-build
      - run: npm run test:build-lock
      - run: npm run test:tooling:dependencies
      - run: node scripts/check-browser-deps-cache.mjs
      - run: npm run check:seo
      - run: npm run check:supabase:migrations
      - run: npm run test:deploy:rollback

  booking-model:
    name: Booking hold model
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run check:booking-model

  playwright:
    name: Playwright ${{ matrix.suite.name }}
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: navigation
            relocate: true
          - name: booking
          - name: rest-1
          - name: rest-2
          - name: rest-3
          - name: rest-4
    env:
      PW_SUITE: ${{ matrix.suite.name }}
      ROO_TEST_HOST: 127.0.0.1
      BASE_URL: http://127.0.0.1:3211
      PW_PORT: "3211"
      TOOLING_CONTENT_PORT: "3219"
      PW_SERVER_ID: ci
      NEXT_DIST_DIR: .next-e2e-ci
      TOOLING_API_ROUTES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium webkit
          build-dirs: ${{ !matrix.suite.relocate && '.next-e2e-ci/cache/webpack' || '' }}
      - name: Build from a clean checkout at another path
        if: ${{ matrix.suite.relocate }}
        run: |
          relocated="$RUNNER_TEMP/relocated/RooIndustries"
          git worktree add --detach "$relocated" HEAD
          cp -a --reflink=auto node_modules "$relocated/"
          echo "SUITE_DIR=$relocated" >> "$GITHUB_ENV"
      - name: Pick a fixed group's spec file
        if: ${{ !startsWith(matrix.suite.name, 'rest-') }}
        run: |
          case "$PW_SUITE" in
            navigation) echo 'PW_FILES=/section-nav\.spec\.js$' >> "$GITHUB_ENV" ;;
            booking) echo 'PW_FILES=/booking-flow\.spec\.js$' >> "$GITHUB_ENV" ;;
            *) echo "Unknown browser group $PW_SUITE" >&2; exit 1 ;;
          esac
      - name: Restore the latest per-file test timings
        if: startsWith(matrix.suite.name, 'rest-')
        uses: actions/cache/restore@v4
        with:
          path: .playwright-timings
          key: playwright-timings-latest
          restore-keys: playwright-timings-
      - name: Pick this group's spec files
        if: startsWith(matrix.suite.name, 'rest-')
        run: |
          files="$(node scripts/playwright-groups.mjs "$PW_SUITE" .playwright-timings/timings.json)"
          echo "PW_FILES=$files" >> "$GITHUB_ENV"
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3211"
      - name: Run browser and agent-readiness tests
        run: |
          cd "${SUITE_DIR:-$GITHUB_WORKSPACE}"
          node scripts/test-tooling-sweep-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          for _ in {1..180}; do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          if [ "$PW_SUITE" = "rest-1" ] || [ "$PW_SUITE" = "navigation" ]; then
            bash scripts/build-fingerprint.sh "$RUNNER_TEMP/build-fingerprint/$PW_SUITE.txt"
          fi
          if [ "$PW_SUITE" = "rest-1" ]; then
            npm run check:no-scripting-media
            guarded_options="$(node scripts/lib/node-options.mjs --import "$PWD/scripts/lib/test-target-safety.mjs")"
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:agent-readiness
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:traffic-recovery
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:tourney-retirement:phases
            npm run test:remote-browser-guard
            npm run test:smoke:production
          fi
          xvfb-run -a npx playwright test --pass-with-no-tests --reporter=dot,json "$PW_FILES"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-timings/${{ matrix.suite.name }}.json
      - uses: ./.github/actions/save-caches
        if: ${{ !matrix.suite.relocate }}
        with:
          build-dirs: .next-e2e-ci/cache/webpack
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.suite.name == 'rest-1' || matrix.suite.name == 'navigation' }}
        with:
          name: build-fingerprint-${{ matrix.suite.name }}
          path: ${{ runner.temp }}/build-fingerprint/
          if-no-files-found: error
          retention-days: 7
      - name: Reduce test timings
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/reduced-timings"
          node scripts/playwright-timings.mjs --allow-empty "${SUITE_DIR:-$GITHUB_WORKSPACE}/test-timings" > "$RUNNER_TEMP/reduced-timings/$PW_SUITE.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: test-timings-${{ matrix.suite.name }}
          path: ${{ runner.temp }}/reduced-timings/${{ matrix.suite.name }}.json
          if-no-files-found: error
          retention-days: 8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.suite.name }}
          path: |
            ${{ env.SUITE_DIR || github.workspace }}/test-results/
            ${{ env.SUITE_DIR || github.workspace }}/test-timings/
          if-no-files-found: ignore
          retention-days: 3

  routes:
    name: Playwright creator portal and API routes
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      ROO_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium
          build-dirs: |
            .next-e2e-routes-api/cache/webpack
            .next-e2e-routes-portal/cache/webpack
            .next-e2e-routes-contact/cache/webpack
            .next-e2e-pixel/cache/webpack
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3231 3241 3251 3261"
      - name: Run API route suite
        id: api-routes
        env:
          PW_PORT: "3231"
          PW_SERVER_ID: routes-api
        run: xvfb-run -a npm run test:api:routes -- --output=test-results/api-routes
      - name: Run creator portal suite
        if: ${{ !cancelled() && (success() || steps.api-routes.outcome == 'failure') }}
        env:
          PW_PORT: "3241"
          PW_SERVER_ID: routes-portal
        run: xvfb-run -a npm run test:creator:portal -- --output=test-results/creator-portal
      - name: Run contact form suite
        if: ${{ !cancelled() }}
        env:
          PW_PORT: "3251"
          PW_SERVER_ID: routes-contact
        run: xvfb-run -a npm run test:contact -- --output=test-results/contact
      - name: Run consent suite against a build with the Meta pixel set
        if: ${{ !cancelled() }}
        env:
          PW_PORT: "3261"
        run: xvfb-run -a npm run test:consent:pixel -- --output=test-results/consent-pixel
      - name: Run creator portal against an external fixture server
        if: ${{ !cancelled() }}
        run: npm run test:fixture-ports:browser
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: |
            .next-e2e-routes-api/cache/webpack
            .next-e2e-routes-portal/cache/webpack
            .next-e2e-routes-contact/cache/webpack
            .next-e2e-pixel/cache/webpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-routes
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  native:
    name: Native PostgreSQL 17 suites
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3211"
      PW_SERVER_ID: native
      NEXT_DIST_DIR: .next-e2e-native-admin
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "STORAGE_SOURCE=$RUNNER_TEMP/roo-storage-api-v1.79.33" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          build-dirs: .next-e2e-native-admin/cache/webpack
      - uses: ./.github/actions/postgres
      - name: Build the pinned native Storage fixture
        run: |
          git clone --depth 1 --branch v1.79.33 https://github.com/supabase/storage.git "$STORAGE_SOURCE"
          test "$(git -C "$STORAGE_SOURCE" rev-parse HEAD)" = "2379ad5493f06bcf3bb5f044b844e292b98df4a0"
          npx --yes npm@11.12.1 ci --prefix "$STORAGE_SOURCE"
          npx --yes npm@11.12.1 run build --prefix "$STORAGE_SOURCE"
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3211"
      - name: Run native admin CMS suite
        run: xvfb-run -a npx playwright test -c playwright.admin-native.config.js
      - name: Run image size fill suite
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/image-size-fill.json
        run: |
          xvfb-run -a npx playwright test -c playwright.admin.config.js tests/image-size-fill.spec.js --output=test-results/image-size-fill --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/image-size-fill.json');
          assert.equal(stats.skipped, 0, 'Image size fill cases must not skip');
          assert.equal(stats.expected, 10, 'All image size fill cases must pass');
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run write conflict browser cases
        run: xvfb-run -a npm run test:conflict-ui:postgres17
      - name: Run the tooling safety suite
        run: npm run test:tooling:safety
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: .next-e2e-native-admin/cache/webpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-native
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  native-publish:
    name: Native PostgreSQL 17 publish suite
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3271"
      PW_SERVER_ID: native-publish
      NEXT_DIST_DIR: .next-e2e-native-publish
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "STORAGE_SOURCE=$RUNNER_TEMP/roo-storage-api-v1.79.33" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          build-dirs: .next-e2e-native-publish/cache/webpack
      - uses: ./.github/actions/postgres
      - name: Build the pinned native Storage fixture
        run: |
          git clone --depth 1 --branch v1.79.33 https://github.com/supabase/storage.git "$STORAGE_SOURCE"
          test "$(git -C "$STORAGE_SOURCE" rev-parse HEAD)" = "2379ad5493f06bcf3bb5f044b844e292b98df4a0"
          npx --yes npm@11.12.1 ci --prefix "$STORAGE_SOURCE"
          npx --yes npm@11.12.1 run build --prefix "$STORAGE_SOURCE"
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3271"
      - name: Run native publish suite
        run: xvfb-run -a npx playwright test -c playwright.admin-publish.config.js
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: .next-e2e-native-publish/cache/webpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-native-publish
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  native-payouts:
    name: Native PostgreSQL 17 payout and recovery suites
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3211"
      PW_SERVER_ID: native
      NEXT_DIST_DIR: .next-e2e-native-admin
      BOOKING_CONTACT_PORT: "3220"
      BOOKING_ROUTE_PORT: "3225"
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
      - uses: ./.github/actions/postgres
      - name: Run the payout and recovery suites
        uses: ./.github/actions/npm-suites
        with:
          suites: creator-payouts:postgres17 booking-payment-window payment-recovery:postgres17 payment-recovery-hold-sql:postgres17 payment-recovery-capture-gates:postgres17 conflict-codes:postgrest write-conflicts:postgres17 referral-reset-conflict:postgres17
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-native-payouts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  native-booking:
    name: Native PostgreSQL 17 booking suites
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository
      && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3281"
      PW_SERVER_ID: native-booking
      NEXT_DIST_DIR: .next-e2e-native-booking
      BOOKING_CONTACT_PORT: "3290"
      BOOKING_ROUTE_PORT: "3295"
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          build-dirs: .next-e2e-native-booking/cache/webpack
      - uses: ./.github/actions/postgres
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3281"
      - name: Run native booking-hold, hold rules, payment recovery, coupon and slot lifecycle browser cases
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-booking-hold.json
        run: |
          xvfb-run -a npx playwright test tests/booking-hold.spec.js tests/booking-hold-rules.spec.js tests/booking-payment-recovery.spec.js tests/booking-coupons.spec.js tests/booking-slot-lifecycle.spec.js --project=chromium --workers=1 --retries=0 --output=test-results/booking-hold-e2e --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/native-booking-hold.json');
          assert.equal(stats.skipped, 0, 'Native booking-hold cases must not skip');
          assert.equal(stats.expected, 68, 'All native booking cases must pass');
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run all four native booking and email browser cases
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-booking-emails.json
        run: |
          xvfb-run -a npx playwright test tests/booking-email-browser.spec.js --project=chromium --workers=1 --retries=0 --output=test-results/booking-emails-e2e --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/native-booking-emails.json');
          assert.equal(stats.skipped, 0);
          assert.equal(stats.expected, 4);
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run all eight native lookup browser cases
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-lookup-filters.json
        run: |
          xvfb-run -a npx playwright test tests/lookup-filters-browser.spec.js --project=chromium --workers=1 --retries=0 --output=test-results/lookup-filters-e2e --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/native-lookup-filters.json');
          assert.equal(stats.skipped, 0);
          assert.equal(stats.expected, 8);
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run booking-contact PostgreSQL 17 suite
        run: npm run test:booking-contact
      - name: Run booking hold API suite
        run: npm run test:booking:holds
      - name: Run payment persistence sweep on the full migration chain
        run: node scripts/test-payment-persistence-sweep.mjs --full-chain
      - name: Run the remaining PostgreSQL 17 suites
        uses: ./.github/actions/npm-suites
        with:
          suites: >-
            booking-hold upgrade-credit upgrade-credit:ownership emails:postgres17 referral:postgres17
            referral-social:postgres17 backend-integrity:postgres17 referral-authority:postgres17
            referral-email:postgres17 referral-integrity:postgres17 account-domain:postgres17
            account-check:postgres17 commerce-readiness:postgres17 commerce-readiness-scale:postgres17
            referral-email:origins lookup-filters:postgres17
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: .next-e2e-native-booking/cache/webpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-native-booking
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  revalidation:
    name: Playwright revalidation
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      ROO_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium
          build-dirs: |
            .next-e2e-revalidation-benchmarks/cache/webpack
            .next-e2e-revalidation-static/cache/webpack
            .next-e2e-image-sizes/cache/webpack
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3251 3261 3271"
      - name: Run benchmarks revalidation suite
        id: benchmarks-revalidation
        env:
          PW_PORT: "3251"
          PW_SERVER_ID: revalidation-benchmarks
        run: xvfb-run -a npm run test:benchmarks:revalidation -- --output=test-results/benchmarks-revalidation
      - name: Run static pages revalidation suite
        if: ${{ !cancelled() && (success() || steps.benchmarks-revalidation.outcome == 'failure') }}
        env:
          PW_PORT: "3261"
          PW_SERVER_ID: revalidation-static
        run: xvfb-run -a npm run test:static:revalidation -- --output=test-results/static-revalidation
      - name: Run stored image sizes suite
        if: ${{ !cancelled() }}
        env:
          PW_PORT: "3271"
          PW_SERVER_ID: image-sizes
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/stored-image-sizes.json
        run: |
          xvfb-run -a npm run test:image-sizes -- --output=test-results/image-sizes --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/stored-image-sizes.json');
          assert.equal(stats.skipped, 0, 'Stored image size cases must not skip');
          assert.equal(stats.expected, 15, 'All stored image size cases must pass');
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: |
            .next-e2e-revalidation-benchmarks/cache/webpack
            .next-e2e-revalidation-static/cache/webpack
            .next-e2e-image-sizes/cache/webpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-revalidation
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  record-tested-tree:
    name: Record the tested tree
    if: >-
      !cancelled()
      && needs.monitoring.result == 'success'
      && needs.jest.result == 'success'
      && needs.booking-model.result == 'success'
      && needs.playwright.result == 'success'
      && needs.routes.result == 'success'
      && needs.native.result == 'success'
      && needs.native-booking.result == 'success'
      && needs.native-publish.result == 'success'
      && needs.native-payouts.result == 'success'
      && needs.revalidation.result == 'success'
    needs: [monitoring, jest, booking-model, playwright, routes, native, native-booking, native-publish, native-payouts, revalidation]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: build-fingerprint-*
          path: build-fingerprint
          merge-multiple: true
      - name: Compare the cached build with the clean build from another path
        run: bash scripts/compare-build-fingerprints.sh build-fingerprint/rest-1.txt build-fingerprint/navigation.txt
      - id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p tested-tree
          echo "$tree" > tested-tree/tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree/
          retention-days: 30

  tests-passed:
    name: All tests passed
    permissions:
      actions: read
      contents: read
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    needs:
      - tested-tree
      - monitoring
      - jest
      - booking-model
      - playwright
      - routes
      - native
      - native-booking
      - native-publish
      - native-payouts
      - revalidation
      - record-tested-tree
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          FORK: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          failed="$(jq -r --arg event "$GITHUB_EVENT_NAME" --argjson fork "$FORK" '
            if $event == "pull_request" and ($fork or .["tested-tree"].outputs.tested != "true") then
              to_entries | map(select(.value.result != (
                if .key == "tested-tree" and $fork then "skipped" else "success" end)))
            elif ($event | IN("merge_group", "push", "workflow_dispatch"))
              and .["tested-tree"].outputs.tested == "false" and all(.[]; .result == "success") then
              []
            elif ($event | IN("pull_request", "merge_group", "push", "workflow_dispatch"))
              and .["tested-tree"].result == "success" and .["tested-tree"].outputs.tested == "true" then
              to_entries | map(select(.value.result != (if .key == "tested-tree" then "success" else "skipped" end)))
            else
              [{key: "invalid test results", value: {result: "failure"}}]
            end
            | map("\(.key)=\(.value.result)") | join(", ")
          ' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "Tests did not pass: $failed"
            exit 1
          fi
          shortcut="$(jq -r --arg event "$GITHUB_EVENT_NAME" '
            ($event | IN("pull_request", "merge_group", "push", "workflow_dispatch"))
            and .["tested-tree"].result == "success" and .["tested-tree"].outputs.tested == "true"
            and (all(.[]; .result == "success") | not)
          ' <<< "$NEEDS")"
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")"
          failed="$(jq -sr --argjson fork "$FORK" --argjson shortcut "$shortcut" '
            [.[].jobs[] | select(.name != "All tests passed")] as $jobs
            | [$jobs[] | select(
                .status != "completed" or
                .conclusion != (if .name == "Check for an already tested tree" then
                  if $fork then "skipped" else "success" end
                elif $shortcut then "skipped" else "success" end)
              ) | "\(.name)=\(.status)/\(.conclusion // "null")"]
            + (if any($jobs[]; (.name | startswith("Playwright ")) and .name != "Playwright creator portal and API routes" and .name != "Playwright revalidation") then [] else ["No Playwright matrix jobs listed"] end)
            | join(", ")
          ' <<< "$jobs")"
          if [ -n "$failed" ]; then
            echo "Tests did not pass: $failed"
            exit 1
          fi
