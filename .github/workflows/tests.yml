name: Tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tested-tree:
    name: Check for an already tested tree
    if: github.event_name == 'push'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/tested-tree.sh

  monitoring:
    name: Production-only monitoring
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      SENTRY_CLI_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          browser-deps: "false"
      - name: Check network isolation tools
        run: |
          command -v unshare
          command -v ip
          command -v cc
      - name: Check monitoring
        run: |
          if command -v heavy >/dev/null; then
            heavy npm run test:monitoring
            heavy npm run test:monitoring:startup
            heavy npm run test:monitoring:startup
            heavy npm run test:monitoring:deployments
          else
            npm run test:monitoring
            npm run test:monitoring:startup
            npm run test:monitoring:startup
            npm run test:monitoring:deployments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-deployments
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  jest:
    name: Jest
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: |
          node_options="$(node scripts/lib/node-options.mjs --import "$PWD/scripts/lib/test-target-safety.mjs")"
          NODE_OPTIONS="$node_options" npm test -- --maxWorkers=2
        env:
          BASE_URL: http://127.0.0.1:3211
          TOOLING_NETWORK_GUARD: "1"
      - run: npm run lint
      - run: npm run test:repository-files
      - run: npm run test:runner-routing
      - run: npm run test:lint-rules
      - run: npm run test:playwright-groups
      - run: npm run test:tested-tree
      - run: npm run test:free-ports
      - run: npm run test:fixture-ports
      - run: npm run test:reproducible-build
      - run: npm run test:build-lock
      - run: npm run test:tooling:dependencies
      - run: node scripts/check-browser-deps-cache.mjs
      - run: npm run check:seo
      - run: npm run check:supabase:migrations
      - run: npm run test:deploy:rollback

  booking-model:
    name: Booking hold model
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run check:booking-model

  playwright-plan:
    name: Plan browser groups
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - name: Restore the latest per-file test timings
        uses: actions/cache/restore@v4
        with:
          path: .playwright-timings
          key: playwright-timings-latest
          restore-keys: playwright-timings-
      - name: Pick browser groups and their job limits
        id: plan
        run: |
          matrix="$(node scripts/playwright-groups.mjs matrix .playwright-timings/timings.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          native="$(node scripts/playwright-groups.mjs native)"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  playwright:
    name: Playwright ${{ matrix.suite.name }}
    needs: [tested-tree, playwright-plan]
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && needs.playwright-plan.result == 'success' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.suite.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.playwright-plan.outputs.matrix) }}
    env:
      PW_SUITE: ${{ matrix.suite.name }}
      PW_FILES: ${{ matrix.suite.pattern }}
      PW_GROUP_TIMEOUT_MS: ${{ matrix.suite.timeoutMs }}
      ROO_TEST_HOST: 127.0.0.1
      BASE_URL: http://127.0.0.1:3211
      PW_PORT: "3211"
      TOOLING_CONTENT_PORT: "3219"
      PW_SERVER_ID: ci
      NEXT_DIST_DIR: .next-e2e-ci
      TOOLING_API_ROUTES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium webkit
          build-dirs: ${{ !matrix.suite.relocate && '.next-e2e-ci/cache/webpack' || '' }}
      - name: Build from a clean checkout at another path
        if: ${{ matrix.suite.relocate }}
        run: |
          relocated="$RUNNER_TEMP/relocated/RooIndustries"
          git worktree add --detach "$relocated" HEAD
          cp -a --reflink=auto node_modules "$relocated/"
          echo "SUITE_DIR=$relocated" >> "$GITHUB_ENV"
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3211"
      - name: Check browser timeout reports
        if: matrix.suite.name == 'rest-1'
        run: xvfb-run -a npm run test:playwright-timeouts
      - name: Save browser timeout reports before the next run
        uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.suite.name == 'rest-1' }}
        with:
          name: playwright-timeout-proof
          path: test-results/playwright-timeouts-*/
          if-no-files-found: error
          retention-days: 7
      - name: Run browser and agent-readiness tests
        run: |
          cd "${SUITE_DIR:-$GITHUB_WORKSPACE}"
          node scripts/test-tooling-sweep-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          for _ in {1..180}; do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          if [ "$PW_SUITE" = "rest-1" ] || [ "$PW_SUITE" = "navigation" ]; then
            bash scripts/build-fingerprint.sh "$RUNNER_TEMP/build-fingerprint/$PW_SUITE.txt"
          fi
          if [ "$PW_SUITE" = "rest-1" ]; then
            npm run check:no-scripting-media
            guarded_options="$(node scripts/lib/node-options.mjs --import "$PWD/scripts/lib/test-target-safety.mjs")"
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:agent-readiness
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:traffic-recovery
            TOOLING_NETWORK_GUARD=1 NODE_OPTIONS="$guarded_options" npm run test:tourney-retirement:phases
            npm run test:remote-browser-guard
            npm run test:smoke:production
          fi
          xvfb-run -a npx playwright test --pass-with-no-tests --reporter=line,json "$PW_FILES"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-timings/${{ matrix.suite.name }}.json
      - uses: ./.github/actions/save-caches
        if: ${{ !matrix.suite.relocate }}
        with:
          build-dirs: .next-e2e-ci/cache/webpack
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.suite.name == 'rest-1' || matrix.suite.name == 'navigation' }}
        with:
          name: build-fingerprint-${{ matrix.suite.name }}
          path: ${{ runner.temp }}/build-fingerprint/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-${{ matrix.suite.name }}
          path: ${{ env.SUITE_DIR || github.workspace }}/test-timings/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite.name }}
          path: ${{ env.SUITE_DIR || github.workspace }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

  routes:
    name: Playwright ${{ matrix.suite.name }}
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.suite.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: api-routes
            script: test:api:routes
            port: "3231"
            timeoutMinutes: 30
          - name: creator-portal
            script: test:creator:portal
            port: "3241"
            extraMs: 900000
            timeoutMinutes: 65
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_GROUP_TIMEOUT_MS: "1200000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium
          build-dirs: .next-e2e-${{ matrix.suite.name }}/cache/webpack
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: ${{ matrix.suite.port }}
      - name: Run browser suite
        env:
          PW_PORT: ${{ matrix.suite.port }}
          PW_SERVER_ID: ${{ matrix.suite.name }}
        run: xvfb-run -a npm run ${{ matrix.suite.script }} -- --output=test-results/${{ matrix.suite.name }}
      - name: Run creator portal against an external fixture server
        if: ${{ !cancelled() && matrix.suite.name == 'creator-portal' }}
        run: npm run test:fixture-ports:browser
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: .next-e2e-${{ matrix.suite.name }}/cache/webpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native PostgreSQL 17 suites
    needs: [tested-tree, playwright-plan]
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && needs.playwright-plan.result == 'success' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ fromJSON(needs.playwright-plan.outputs.native).timeoutMinutes }}
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3211"
      PW_SERVER_ID: native
      NEXT_DIST_DIR: .next-e2e-native-admin
      BOOKING_CONTACT_PORT: "3220"
      BOOKING_ROUTE_PORT: "3225"
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "STORAGE_SOURCE=$RUNNER_TEMP/roo-storage-api-v1.79.33" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          build-dirs: |
            .next-e2e-native-admin/cache/webpack
            .next-e2e-native-booking/cache/webpack
      - uses: ./.github/actions/postgres
      - name: Build the pinned native Storage fixture
        run: |
          git clone --depth 1 --branch v1.79.33 https://github.com/supabase/storage.git "$STORAGE_SOURCE"
          test "$(git -C "$STORAGE_SOURCE" rev-parse HEAD)" = "2379ad5493f06bcf3bb5f044b844e292b98df4a0"
          npx --yes npm@11.12.1 ci --prefix "$STORAGE_SOURCE"
          npx --yes npm@11.12.1 run build --prefix "$STORAGE_SOURCE"
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: "3211"
      - name: Run native admin CMS suite
        env:
          PW_GROUP_TIMEOUT_MS: ${{ fromJSON(needs.playwright-plan.outputs.native).adminTimeoutMs }}
        run: xvfb-run -a npx playwright test -c playwright.admin.config.js
      - name: Run all six native booking-hold browser cases
        env:
          NEXT_DIST_DIR: .next-e2e-native-booking
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-booking-hold.json
          PW_GROUP_TIMEOUT_MS: ${{ fromJSON(needs.playwright-plan.outputs.native).bookingTimeoutMs }}
        run: |
          xvfb-run -a npx playwright test tests/booking-hold.spec.js --project=chromium --output=test-results/booking-hold-e2e --reporter=line,json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stats } = require('./test-results/native-booking-hold.json');
          assert.equal(stats.expected, 6, 'All six native booking-hold cases must pass');
          assert.equal(stats.skipped, 0, 'Native booking-hold cases must not skip');
          assert.equal(stats.unexpected, 0);
          assert.equal(stats.flaky, 0);
          NODE
      - name: Run booking-contact PostgreSQL 17 suite
        run: npm run test:booking-contact
      - name: Run booking hold API suite
        run: npm run test:booking:holds
      - name: Run payment persistence sweep on the full migration chain
        run: node scripts/test-payment-persistence-sweep.mjs --full-chain
      - name: Run the remaining PostgreSQL 17 suites
        uses: ./.github/actions/npm-suites
        with:
          suites: >-
            booking-hold upgrade-credit upgrade-credit:ownership emails:postgres17 referral:postgres17
            referral-social:postgres17 backend-integrity:postgres17 referral-authority:postgres17
            referral-email:postgres17 referral-integrity:postgres17 account-domain:postgres17
            account-check:postgres17 commerce-readiness:postgres17 referral-email:origins tooling:safety
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: |
            .next-e2e-native-admin/cache/webpack
            .next-e2e-native-booking/cache/webpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-native
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  native-payouts:
    name: Native PostgreSQL 17 payout and recovery suites
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_PORT: "3211"
      PW_SERVER_ID: native
      NEXT_DIST_DIR: .next-e2e-native-admin
      BOOKING_CONTACT_PORT: "3220"
      BOOKING_ROUTE_PORT: "3225"
      AT_SPI_BUS_ADDRESS: unix:path=/dev/null
    steps:
      - name: Use the runner temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
      - uses: ./.github/actions/postgres
      - name: Run the payout and recovery suites
        uses: ./.github/actions/npm-suites
        with:
          suites: creator-payouts:postgres17 booking-payment-window payment-recovery:postgres17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-native-payouts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  revalidation:
    name: Playwright ${{ matrix.suite.name }}
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: benchmarks-revalidation
            script: test:benchmarks:revalidation
            port: "3251"
          - name: static-revalidation
            script: test:static:revalidation
            port: "3261"
    env:
      ROO_TEST_HOST: 127.0.0.1
      PW_GROUP_TIMEOUT_MS: "1200000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          browsers: chromium
          build-dirs: .next-e2e-${{ matrix.suite.name }}/cache/webpack
      - uses: ./.github/actions/hold-ports
        with:
          playwright-ports: ${{ matrix.suite.port }}
      - name: Run browser suite
        env:
          PW_PORT: ${{ matrix.suite.port }}
          PW_SERVER_ID: ${{ matrix.suite.name }}
        run: xvfb-run -a npm run ${{ matrix.suite.script }} -- --output=test-results/${{ matrix.suite.name }}
      - uses: ./.github/actions/save-caches
        with:
          build-dirs: .next-e2e-${{ matrix.suite.name }}/cache/webpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  record-tested-tree:
    name: Record the tested tree
    if: >-
      !cancelled()
      && needs.monitoring.result == 'success'
      && needs.jest.result == 'success'
      && needs.booking-model.result == 'success'
      && needs.playwright.result == 'success'
      && needs.routes.result == 'success'
      && needs.native.result == 'success'
      && needs.native-payouts.result == 'success'
      && needs.revalidation.result == 'success'
    needs: [monitoring, jest, booking-model, playwright, routes, native, native-payouts, revalidation]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: build-fingerprint-*
          path: build-fingerprint
          merge-multiple: true
      - name: Compare the cached build with the clean build from another path
        run: bash scripts/compare-build-fingerprints.sh build-fingerprint/rest-1.txt build-fingerprint/navigation.txt
      - id: tree
        if: github.event_name == 'pull_request'
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p tested-tree
          echo "$tree" > tested-tree/tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree/
          retention-days: 30

  tests-passed:
    name: All tests passed
    permissions:
      actions: read
      contents: read
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.TESTS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    needs: [tested-tree, monitoring, jest, booking-model, playwright, routes, native, native-payouts, revalidation, record-tested-tree]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed="$(jq -r --arg event "$GITHUB_EVENT_NAME" '
            if $event == "pull_request" or $event == "merge_group" then
              to_entries | map(select(.value.result != (if .key == "tested-tree" then "skipped" else "success" end)))
            elif $event == "push" and all(.[]; .result == "success") then
              []
            elif $event == "push" and .["tested-tree"].result == "success" and .["tested-tree"].outputs.tested == "true" then
              to_entries | map(select(.value.result != (if .key == "tested-tree" then "success" else "skipped" end)))
            elif $event == "push" then
              to_entries | map(select(.value.result != "success"))
            else
              to_entries
            end
            | map("\(.key)=\(.value.result)") | join(", ")
          ' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "Tests did not pass: $failed"
            exit 1
          fi
          shortcut="$(jq -r --arg event "$GITHUB_EVENT_NAME" '
            $event == "push" and .["tested-tree"].result == "success"
            and .["tested-tree"].outputs.tested == "true"
            and (all(.[]; .result == "success") | not)
          ' <<< "$NEEDS")"
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")"
          failed="$(jq -sr --arg event "$GITHUB_EVENT_NAME" --argjson shortcut "$shortcut" '
            [.[].jobs[] | select(.name != "All tests passed")] as $jobs
            | [$jobs[] | select(
                .status != "completed" or
                .conclusion != (if .name == "Check for an already tested tree" then
                  if $event == "push" then "success" else "skipped" end
                elif $shortcut then "skipped" else "success" end)
              ) | "\(.name)=\(.status)/\(.conclusion // "null")"]
            + (if any($jobs[]; (.name | startswith("Playwright ")) and .name != "Playwright creator portal and API routes" and .name != "Playwright revalidation") then [] else ["No Playwright matrix jobs listed"] end)
            | join(", ")
          ' <<< "$jobs")"
          if [ -n "$failed" ]; then
            echo "Tests did not pass: $failed"
            exit 1
          fi
