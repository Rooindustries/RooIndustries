name: Production smoke

on:
  deployment_status:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-smoke
  queue: max
  cancel-in-progress: false

jobs:
  smoke:
    name: Money-path smoke
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: [self-hosted, Linux, X64, roo-production-smoke]
    timeout-minutes: 30
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Smoke the money path and recover a failing deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_RECOVERY_EPOCH: ${{ vars.PRODUCTION_RECOVERY_EPOCH }}
        run: npm run --silent deploy:gate
