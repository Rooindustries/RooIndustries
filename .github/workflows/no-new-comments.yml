name: No new comments

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: no-new-comments-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    if: github.event_name == 'pull_request'
    name: Comment checker cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: The check still catches its own cases
        run: node --test tests/no-new-comments.test.mjs

  policy:
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
    name: Comment policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      MERGE_GROUP: ${{ github.event_name == 'merge_group' }}
    steps:
      - name: Mark the policy as running on the pull request commit
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context=no-new-comments \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the commit to check
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "$HEAD_SHA"
          if [[ ! -f .github/no-new-comments.mjs ]]; then git checkout "$HEAD_SHA" -- .; fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: No new comments or authorship credits
        id: policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/no-new-comments.mjs
      - name: Report the result on the pull request commit
        id: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_RESULT: ${{ steps.policy.outcome }}
        run: |
          state=failure
          if [[ $POLICY_RESULT == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=no-new-comments \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
