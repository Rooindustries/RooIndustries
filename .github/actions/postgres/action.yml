name: Install PostgreSQL 17 and PostgREST
description: Installs PostgreSQL 17 and the PostgREST version production runs, and exports PG_BIN and POSTGREST_BIN.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/roo-postgrest
        key: postgrest-linux-static-x86-64-${{ hashFiles('.github/actions/postgres/action.yml') }}
    - if: ${{ !startsWith(runner.name, 'devbox-') }}
      shell: bash
      run: |
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install --yes --no-install-recommends postgresql-17
    - shell: bash
      env:
        POSTGREST_VERSION: "14.5"
        POSTGREST_SHA256: ab5cc7e974d4940447991804588cfb8b3f7b2c57b691f0905df04d51ede69470
      run: |
        release="postgrest-v$POSTGREST_VERSION-linux-static-x86-64.tar.xz"
        archive="$HOME/.cache/roo-postgrest/$release"
        mkdir -p "$(dirname "$archive")" "$RUNNER_TEMP/postgrest"
        if [ ! -f "$archive" ]; then
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            "https://github.com/PostgREST/postgrest/releases/download/v$POSTGREST_VERSION/$release" -o "$archive"
        fi
        echo "$POSTGREST_SHA256  $archive" | sha256sum --check
        tar -xJf "$archive" -C "$RUNNER_TEMP/postgrest"
        /usr/lib/postgresql/17/bin/postgres --version
        test "$("$RUNNER_TEMP/postgrest/postgrest" --version)" = "PostgREST $POSTGREST_VERSION"
        echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
        echo "POSTGREST_BIN=$RUNNER_TEMP/postgrest/postgrest" >> "$GITHUB_ENV"
