name: Set up the test toolchain
description: Node, cached packages and Playwright browsers, and restored Next build caches.
inputs:
  node-version:
    required: true
  browsers:
    description: Space-separated Playwright browsers to install.
    default: ""
  browser-deps:
    description: Install the browsers' system packages too.
    default: "true"
  build-dirs:
    description: Newline-separated Next compiler cache folders to restore.
    default: ""
runs:
  using: composite
  steps:
    - if: ${{ !startsWith(runner.name, 'devbox-') }}
      shell: bash
      run: |
        if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] &&
           [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
          printf '%s\n' 'abi <abi/4.0>,' \
            'profile roo-fixture-unshare /usr/bin/unshare flags=(unconfined) {' \
            '  userns,' '}' | sudo apparmor_parser --replace
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - id: modules
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - if: steps.modules.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
    - id: playwright
      if: inputs.browsers != ''
      shell: bash
      run: |
        echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "browsers=$(tr ' ' '-' <<< "$BROWSERS")" >> "$GITHUB_OUTPUT"
      env:
        BROWSERS: ${{ inputs.browsers }}
    - id: browsers
      if: inputs.browsers != ''
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}
    - id: system-packages
      if: ${{ inputs.browsers != '' && inputs.browser-deps == 'true' && !startsWith(runner.name, 'devbox-') }}
      shell: bash
      run: |
        . /etc/os-release
        echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:-self-hosted}" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - name: Restore browser system packages
      id: apt-packages
      if: ${{ inputs.browsers != '' && inputs.browser-deps == 'true' && !startsWith(runner.name, 'devbox-') }}
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/roo-playwright-apt/*.deb
        key: playwright-apt-${{ runner.arch }}-${{ steps.system-packages.outputs.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}-${{ steps.system-packages.outputs.image }}-${{ steps.system-packages.outputs.week }}
        restore-keys: playwright-apt-${{ runner.arch }}-${{ steps.system-packages.outputs.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}-
    - name: Install cached browser system packages
      id: install-system-packages
      if: ${{ inputs.browsers != '' && inputs.browser-deps == 'true' && !startsWith(runner.name, 'devbox-') }}
      shell: bash
      run: bash scripts/install-browser-deps.sh $BROWSERS
      env:
        BROWSERS: ${{ inputs.browsers }}
    - name: Save browser system packages
      if: ${{ always() && steps.install-system-packages.outcome == 'success' && steps.apt-packages.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && !startsWith(runner.name, 'devbox-') }}
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/roo-playwright-apt/*.deb
        key: ${{ steps.apt-packages.outputs.cache-primary-key }}
    - if: inputs.browsers != '' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install $BROWSERS
      env:
        BROWSERS: ${{ inputs.browsers }}
    - if: inputs.browsers != '' && steps.browsers.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browsers.outputs.cache-primary-key }}
    - if: inputs.build-dirs != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.build-dirs }}
        key: next-build-${{ github.job }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-${{ github.sha }}
        restore-keys: next-build-${{ github.job }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-
